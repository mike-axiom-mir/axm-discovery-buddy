name: Discovery Source File Admission

on:
  push:
    branches:
      - automation/truth-sentinel-discovery-source-file-admission-20260911
  pull_request:
    paths:
      - 'discovery_buddy/scanner.py'
      - 'tests/test_source_file_admission.py'
      - 'tests/test_scanner.py'
      - '.github/workflows/discovery-source-file-admission.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  source-file-admission:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scanner and admission tests
        run: python -m compileall -q discovery_buddy tests/test_source_file_admission.py tests/test_scanner.py
      - name: Reproduce scanner source-file admission boundary
        run: python -m unittest -v tests/test_source_file_admission.py
      - name: Preserve inherited scanner behavior
        run: python -m unittest -v tests/test_scanner.py
