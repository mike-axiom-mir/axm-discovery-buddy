name: AXM Beacon Tests

on:
  pull_request:
    paths:
      - '.axm/beacon/**'
      - '.axm/beacon.json'
      - 'tests/test_beacon*.py'
      - '.github/workflows/axm-beacon-*.yml'
  push:
    branches: [main]
    paths:
      - '.axm/beacon/**'
      - '.axm/beacon.json'
      - 'tests/test_beacon*.py'
      - '.github/workflows/axm-beacon-*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
