name: One-shot v1.14 import

on:
  push:
    branches:
      - axm/chat-agent-lane-rule-v1
    paths:
      - '.github/workflows/axm-v114-import.yml'

permissions:
  contents: write

jobs:
  import:
    if: "!contains(github.event.head_commit.message, '[expanded]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR lane
        uses: actions/checkout@v4
        with:
          ref: axm/chat-agent-lane-rule-v1
          fetch-depth: 0

      - name: Expand v1.14 modular source
        shell: bash
        run: |
          set -euo pipefail
          cat .axm-import/part-* | base64 -d > /tmp/axm-v114.tar.gz
          tar -xzf /tmp/axm-v114.tar.gz -C .
          rm -rf .axm-import
          rm -f .github/workflows/axm-v114-import.yml

      - name: Verify deterministic source
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run build
          rm -f START_HERE.html

      - name: Commit expanded build to this lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "import: Discovery Buddy v1.14 reader-organ workstation [expanded]"
          git push origin HEAD:axm/chat-agent-lane-rule-v1
