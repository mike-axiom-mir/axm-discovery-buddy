name: Materialize Discovery Buddy v1.14 import

on:
  push:
    branches:
      - axm/chat-agent-lane-rule-v1
    paths:
      - '.repo-import/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lane
        uses: actions/checkout@v4
        with:
          ref: axm/chat-agent-lane-rule-v1
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-import/part-* | base64 --decode > /tmp/discovery-v114.tar.gz
          tar -xzf /tmp/discovery-v114.tar.gz
          python scripts/build_standalone.py
          python scripts/regenerate_manifest.py

      - name: Verify imported body
        shell: bash
        run: |
          set -euo pipefail
          npm test
          test -f START_HERE.html
          test -f source/reader-organs.js
          test -f source/software-graph.js
          test -f MANIFEST.json

      - name: Replace temporary import with real repository tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repo-import
          rm -f .github/workflows/materialize-v114-import.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'AXM Discovery Import'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'import: Discovery Buddy v1.14 reader-organ workstation'
          git push origin HEAD:axm/chat-agent-lane-rule-v1
