name: Discovery Output Durability

on:
  pull_request:
    paths:
      - 'discovery_buddy/cli.py'
      - 'discovery_buddy/output_lock.py'
      - 'discovery_buddy/recovery_desk.py'
      - 'tests/test_output_durability.py'
      - 'tests/test_output_single_writer.py'
      - 'tests/test_recovery_desk.py'
      - 'tests/generate_recovery_desk_evidence.py'
      - 'tests/recovery_desk_browser.py'
      - 'docs/RECOVERY_DESK.md'
      - '.github/workflows/discovery-output-durability.yml'
  push:
    branches: [main]
    paths:
      - 'discovery_buddy/cli.py'
      - 'discovery_buddy/output_lock.py'
      - 'discovery_buddy/recovery_desk.py'
      - 'tests/test_output_durability.py'
      - 'tests/test_output_single_writer.py'
      - 'tests/test_recovery_desk.py'
      - 'tests/generate_recovery_desk_evidence.py'
      - 'tests/recovery_desk_browser.py'
      - 'docs/RECOVERY_DESK.md'
      - '.github/workflows/discovery-output-durability.yml'

permissions:
  contents: read

jobs:
  durability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact checked-out head
        run: git rev-parse HEAD
      - name: Recovery and durability contracts
        run: >-
          python -m unittest -v
          tests/test_recovery_desk.py
          tests/test_output_durability.py
          tests/test_output_single_writer.py
          tests/test_scanner.py
      - name: Dependency-free Python syntax
        run: python -m compileall -q discovery_buddy tests

  recovery-desk-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate real interrupted-publication preview and exercise production recovery
        run: PYTHONPATH=. python tests/generate_recovery_desk_evidence.py
      - name: Bind evidence to exact checked-out head
        run: git rev-parse HEAD | tee evidence/recovery-desk/git-head.txt
      - name: Install browser evidence driver
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Exercise exact generated Recovery Desk in Chromium
        run: PYTHONPATH=. python tests/recovery_desk_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-recovery-desk-evidence
          path: evidence/recovery-desk/
          if-no-files-found: error
